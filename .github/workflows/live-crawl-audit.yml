name: Public live crawl audit
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '37 06 * * *'
  push:
    branches: [main]

concurrency:
  group: public-seo-watch-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check-public-sites:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Crawl production sitemaps and sample routes (read-only)
        run: node scripts/audit-live-sites.mjs
      - name: Investigate crawler user-agent Cloudflare rules
        run: node scripts/check-user-agents.mjs
      - name: Check production rollout markers
        run: node scripts/check-production-version.mjs
